<!DOCTYPE html>
<html lang="zh-CN" data-theme="euro-pink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6E8EA">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>西洋豆浆萃</title>
<style>
:root, [data-theme="euro-pink"]{--bg:#F6E8EA;--card:#FFFFFF;--card2:#F9E8E9;--text:#3A2022;--dim:#A8787A;--title:#673D47;--accent:#B34C4E;--border:rgba(103,61,71,.1);--fab-bg:#673D47;--fab-fg:#F9E8E9;--shadow:0 2px 10px rgba(103,61,71,.08);--r:16px;}
[data-theme="euro-blue"]{--bg:#E8EFF4;--card:#FFFFFF;--card2:#E6EFF6;--text:#1B2A38;--dim:#7A93A8;--title:#29475F;--accent:#326FAD;--border:rgba(41,71,95,.1);--fab-bg:#29475F;--fab-fg:#E6EFF6;--shadow:0 2px 10px rgba(41,71,95,.08);}
[data-theme="euro-green"]{--bg:#E7EFEA;--card:#FFFFFF;--card2:#E4F0E8;--text:#1C2E25;--dim:#7A9987;--title:#2D5044;--accent:#347B59;--border:rgba(45,80,68,.1);--fab-bg:#2D5044;--fab-fg:#E4F0E8;--shadow:0 2px 10px rgba(45,80,68,.08);}
[data-theme="euro-gold"]{--bg:#F7F0E5;--card:#FFFFFF;--card2:#FAF0DF;--text:#332B21;--dim:#A8957C;--title:#65513B;--accent:#BA8B36;--border:rgba(101,81,59,.1);--fab-bg:#65513B;--fab-fg:#FAF0DF;--shadow:0 2px 10px rgba(101,81,59,.08);}
[data-theme="euro-purple"]{--bg:#EFEAF2;--card:#FFFFFF;--card2:#EFE8F4;--text:#2A2133;--dim:#9182A3;--title:#513B68;--accent:#75529E;--border:rgba(81,59,104,.1);--fab-bg:#513B68;--fab-fg:#EFE8F4;--shadow:0 2px 10px rgba(81,59,104,.08);}
[data-theme="dark"]{--bg:#161823;--card:#1E2130;--card2:#232739;--text:#E6EAF2;--dim:#8B93A8;--title:#B8CEE2;--accent:#53589A;--border:rgba(184,206,226,.16);--fab-bg:#53589A;--fab-fg:#E6EAF2;--shadow:0 2px 10px rgba(0,0,0,.35);}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}button{border:none;background:none;cursor:pointer;padding:0;}svg{width:100%;height:100%;display:block;}
.ic{width:22px;height:22px;flex:none;}.ic-sm{width:18px;height:18px;flex:none;}.ic-lg{width:30px;height:30px;flex:none;}.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 10px;min-height:56px;background:var(--bg);transition:background .3s;}
.brand{font-size:20px;font-weight:800;color:var(--title);letter-spacing:.5px;}.tb-title{font-size:19px;font-weight:700;color:var(--title);}.tb-right{display:flex;gap:6px;align-items:center;}
.icon-btn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--title);background:transparent;flex:none;}
.icon-btn:active{background:var(--card2);}.icon-btn .ic{width:18px;height:18px;}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}.view::-webkit-scrollbar{display:none;}
.tabbar{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.05);position:relative;z-index:20;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);padding:4px 0;transition:color .18s;}.tab .tab-icon{width:24px;height:24px;transition:transform .2s;}.tab.active{color:var(--title);}.tab.active .tab-icon{transform:translateY(-1px) scale(1.06);}.tab-label{font-size:10.5px;font-weight:600;letter-spacing:.2px;}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);transition:transform .2s;position:relative;overflow:hidden;}
.hero{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border-radius:20px;padding:20px 18px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);}
.hero-title{font-size:17px;font-weight:800;color:var(--title);margin-bottom:2px;}.hero-sub{font-size:12.5px;color:var(--dim);margin-bottom:16px;}.hero-stats{display:flex;justify-content:space-between;}.hero-stats>div{flex:1;text-align:center;display:flex;flex-direction:column;gap:2px;}.hero-stats b{font-size:19px;color:var(--title);font-weight:800;}.hero-stats span{font-size:11px;color:var(--dim);}
.sec-title{font-size:14px;font-weight:700;color:var(--title);margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between;}.sec-title .more{font-size:12px;font-weight:500;color:var(--dim);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--fab-bg);color:var(--fab-fg);transition:opacity .15s;}.btn:active{opacity:.8;}
.btn-ghost{background:var(--card2);color:var(--title);border:1px solid var(--border);}.btn-danger{background:#C0392B;color:#fff;}.btn-block{width:100%;}.btn-row{display:flex;gap:10px;margin-top:18px;}.btn-row .btn{flex:1;}
.btn-fab-bottom{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--fab-bg);color:var(--fab-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:90;padding:0;margin:0;}.btn-fab-bottom .ic{width:28px;height:28px;}
.field{margin-bottom:14px;}.field label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:6px;letter-spacing:.2px;}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--text);outline:none;transition:border-color .15s;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);}.textarea{min-height:80px;resize:vertical;line-height:1.55;}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}.auto-val{padding:11px 13px;border-radius:12px;background:var(--card2);border:1px dashed var(--border);color:var(--title);font-weight:700;}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px;}
.switch{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}.switch input{display:none;}
.switch .track{width:46px;height:27px;border-radius:14px;background:var(--border);position:relative;transition:background .2s;flex:none;}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + .track{background:var(--accent);}.switch input:checked + .track::after{transform:translateX(19px);}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;border:1px solid var(--border);}.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--dim);transition:all .15s;}.seg button.on{background:var(--card);color:var(--title);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.stars{display:flex;gap:1px;}.star{font-size:20px;line-height:1;color:var(--border);transition:transform .12s,color .12s;padding:0 1px;}.star.on{color:var(--accent);}.star:active{transform:scale(1.2);}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;background:var(--card2);color:var(--dim);margin:0 2px;}.tag-accent{background:var(--accent);color:#fff;}.tag-title{background:var(--title);color:var(--card);}.tag-friend{background:var(--card2);color:var(--accent);border:1px solid var(--border);}
.swipe-container{position:relative;overflow:hidden;margin-bottom:12px;border-radius:var(--r);}
.swipe-actions{position:absolute;top:0;right:0;height:100%;display:flex;z-index:1;}
.swipe-actions button{width:64px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;gap:4px;border:none;}
.swipe-actions .swipe-edit{background:var(--accent);}.swipe-actions .swipe-top{background:var(--title);}.swipe-actions .swipe-del{background:#C0392B;}
.swipe-card{position:relative;z-index:2;transform:translateX(0);transition:transform .25s cubic-bezier(.2,.8,.3,1);background:transparent;border:none;box-shadow:none;padding:0;cursor:pointer;display:block;min-height:60px;}
.swipe-card.swiped{transform:translateX(-192px);}.swipe-card.swiped-2{transform:translateX(-128px);}
.bc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}.bc-name{font-size:16.5px;font-weight:800;color:var(--title);line-height:1.3;}.bc-sub{font-size:12.5px;color:var(--dim);margin-bottom:8px;}
.bc-meta{font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 12px;}.bc-meta b{color:var(--text);font-weight:600;}.bc-tags{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;}
.bc-lite{display:flex;justify-content:space-between;align-items:center;}.bc-lite .bc-name{font-size:15px;}
.empty{text-align:center;padding:50px 20px;color:var(--dim);}.empty .ic-lg{width:44px;height:44px;margin:0 auto 12px;opacity:.4;}.empty p{font-size:13.5px;margin:0 0 16px;}
.top-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}.top-controls .seg{flex:1;max-width:200px;}
.sort-btn{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--title);flex:none;}.sort-btn .ic-sm{width:18px;height:18px;}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--shadow);}.searchbar input{flex:1;border:none;background:transparent;outline:none;}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;flex:1;-ms-overflow-style:none;scrollbar-width:none;}.chips::-webkit-scrollbar{display:none;}.chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--card);color:var(--dim);border:1px solid var(--border);}.chip.on{background:var(--title);color:var(--card);border-color:var(--title);}
.modal{position:fixed;inset:0;z-index:100;display:none;}.modal.show{display:block;}.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s;}.modal-panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.3,1);}.modal-panel::-webkit-scrollbar{display:none;}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}.modal-head h3{margin:0;font-size:18px;font-weight:800;color:var(--title);}.modal-close{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.add-card{background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s;}.add-card:active{transform:scale(.96);}.add-ic{width:48px;height:48px;color:var(--title);display:flex;align-items:center;justify-content:center;}.add-title{font-size:14.5px;font-weight:800;color:var(--title);}.add-sub{font-size:11px;color:var(--dim);}
.dl{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}.dl:last-child{border-bottom:none;}.dl dt{color:var(--dim);flex:none;font-weight:600;}.dl dd{margin:0;text-align:right;color:var(--text);word-break:break-all;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:12px;}.info-item{padding:8px 10px;background:var(--card2);border-radius:10px;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;}
.info-item .label{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:2px;}.info-item .value{font-size:13px;color:var(--text);font-weight:600;word-break:break-all;}
.stat-big{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}.stat-big .label{font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:14px;}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}.stat-grid b{display:block;font-size:19px;color:var(--title);font-weight:800;}.stat-grid span{font-size:11px;color:var(--dim);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}.bar-row .name{width:88px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:600;}.bar-row .bar{flex:1;height:8px;border-radius:5px;background:var(--card2);overflow:hidden;}.bar-row .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s;}.bar-row .val{width:56px;text-align:right;color:var(--dim);font-size:12px;flex:none;}
.chart-container{display:flex;align-items:flex-end;justify-content:space-between;height:160px;padding:10px 0;gap:6px;}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}.chart-bars{flex:1;width:100%;display:flex;justify-content:center;gap:3px;align-items:flex-end;}.chart-bar{width:10px;border-radius:4px 4px 0 0;transition:height .3s;}.chart-bar.buy{background:var(--accent);}.chart-bar.exp{background:var(--title);opacity:0.6;}.chart-label{font-size:9px;color:var(--dim);}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:80vw;text-align:center;}.toast.show{opacity:1;transform:translate(-50%,0);}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.theme-item{border-radius:14px;padding:12px;border:2px solid var(--border);display:flex;flex-direction:column;gap:8px;transition:border-color .15s;}.theme-item.on{border-color:var(--title);}.theme-item .swatches{display:flex;gap:5px;}.theme-item .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.08);}.theme-item .tname{font-size:12.5px;font-weight:700;}
.blend-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}.blend-table th,.blend-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;}.blend-table th{background:var(--card2);color:var(--title);font-weight:700;}.blend-table td{color:var(--text);}
.purchase-row{display:grid;grid-template-columns:1fr 1fr 1fr 24px;gap:6px;margin-bottom:6px;align-items:center;}.purchase-row input{padding:8px 10px;font-size:12px;}.purchase-row button{padding:0;width:24px;height:24px;border-radius:50%;font-size:14px;line-height:1;margin:0 auto;}
.month-picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}.month-picker-grid button{padding:12px 0;border-radius:12px;background:var(--card2);color:var(--text);font-weight:700;border:1px solid var(--border);}.month-picker-grid button.on{background:var(--title);color:var(--card);border-color:var(--title);}.year-selector{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 10px;}.year-selector button{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;}.year-selector span{font-size:18px;font-weight:800;color:var(--title);}
.dropdown-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.1);z-index:50;max-height:180px;overflow-y:auto;display:none;}.dropdown-suggestions.show{display:block;}
.dropdown-suggestions div{padding:10px 13px;font-size:14px;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer;}.dropdown-suggestions div:last-child{border-bottom:none;}.dropdown-suggestions div:active{background:var(--card2);}

.my-theme-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
.my-theme-item.on { border-color: var(--accent); }
.my-theme-item .theme-info { display: flex; align-items: center; gap: 8px; }
.my-theme-item .theme-name { font-size: 13.5px; font-weight: 700; color: var(--title); }
.my-theme-item .theme-colors { display: flex; gap: 4px; }
.my-theme-item .theme-colors span { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.1); }
.my-theme-item .theme-actions { display: flex; gap: 8px; align-items: center; }
.my-theme-item .theme-actions button { font-size: 12px; font-weight: 700; color: var(--dim); padding: 4px; }
.my-theme-item .theme-actions .edit-btn { color: var(--accent); }
.my-theme-item .theme-actions .del-btn { color: #C0392B; }

.color-input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.color-input-row label { width: 60px; font-size: 13px; font-weight: 700; color: var(--dim); }
.color-input-row input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
.color-input-row input[type="text"] { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); outline: none; font-family: monospace; }

.history-colors { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.history-color-box { width: 38px; height: 38px; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; position: relative; transition: transform .12s; }
.history-color-box:active { transform: scale(.9); }
.history-color-box.locked { border-color: var(--accent); }
.history-color-box .lock-icon { position: absolute; bottom: -4px; right: -4px; background: var(--accent); color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; display: flex; align-items: center; justify-content: center; }

.preview-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 10px; box-shadow: var(--shadow); }
.preview-card .p-title { font-size: 16px; font-weight: 800; color: var(--title); }
.preview-card .p-text { font-size: 13px; color: var(--text); margin-top: 4px; }
.preview-card .p-dim { font-size: 12px; color: var(--dim); margin-top: 2px; }
.preview-card .p-btn { display: inline-block; padding: 6px 14px; border-radius: 8px; background: var(--accent); color: var(--fab-fg); font-size: 12px; font-weight: 700; margin-top: 8px; }

.color-bubble-menu { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: flex; overflow: hidden; z-index: 1000; animation: fade .15s; }
.color-bubble-menu button { padding: 8px 14px; font-size: 12px; font-weight: 700; background: var(--card); color: var(--text); border: none; cursor: pointer; }
.color-bubble-menu button:active { background: var(--card2); }
.color-bubble-menu .bubble-del { color: #C0392B; }
.color-bubble-menu .bubble-lock { color: var(--accent); }

.confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; align-items: center; justify-content: center; }
.confirm-overlay.show { display: flex; }
.confirm-box { background: var(--card); border-radius: 16px; width: 260px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.2); text-align: center; }
.confirm-box h4 { margin: 0 0 10px; font-size: 16px; color: var(--title); }
.confirm-box p { margin: 0 0 18px; font-size: 13.5px; color: var(--dim); line-height: 1.5; }
.confirm-box .confirm-btns { display: flex; gap: 10px; }
.confirm-box .confirm-btns button { flex: 1; height: 40px; border-radius: 10px; font-weight: 700; font-size: 13.5px; }
.confirm-box .confirm-cancel { background: var(--card2); color: var(--title); }

function normalizeHex(hex) {
  if (!hex) return '#FFFFFF';
  hex = hex.trim().toUpperCase();
  if (/^#[0-9A-F]{3}$/.test(hex)) return '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
  if (/^#[0-9A-F]{6}$/.test(hex)) return hex;
  if (hex.startsWith('RGB')) {
    const match = hex.match(/\d+/g);
    if (match && match.length >= 3) {
      return rgbToHex(parseInt(match[0]), parseInt(match[1]), parseInt(match[2]));
    }
  }
  return '#FFFFFF';
}
function hexToRgb(hex) {
  let r = 0, g = 0, b = 0;
  if (hex.length == 4) { r = parseInt(hex[1] + hex[1], 16); g = parseInt(hex[2] + hex[2], 16); b = parseInt(hex[3] + hex[3], 16); }
  else if (hex.length == 7) { r = parseInt(hex.substring(1, 3), 16); g = parseInt(hex.substring(3, 5), 16); b = parseInt(hex.substring(5, 7), 16); }
  return [r, g, b];
}
function rgbToHex(r, g, b) { return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase(); }
function getLuminance(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function getContrast(hex1, hex2) {
  const l1 = getLuminance(hex1), l2 = getLuminance(hex2);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
function mixColors(hex1, hex2, weight1) {
  const [r1, g1, b1] = hexToRgb(hex1); const [r2, g2, b2] = hexToRgb(hex2);
  const w1 = weight1, w2 = 1 - weight1;
  return rgbToHex(Math.round(r1 * w1 + r2 * w2), Math.round(g1 * w1 + g2 * w2), Math.round(b1 * w1 + b2 * w2));
}

const STORE_KEY='xydjz_db_v1';
const DEFAULT_SETTINGS={theme:'euro-pink', beanView:'detailed', recipeView:'detailed', appName:'西洋豆浆萃', beanSort:'desc', customThemes:[], historyColors:[]};
function defaultDB(){ return {beans:[],brews:[],experiences:[],recipes:[],settings:Object.assign({},DEFAULT_SETTINGS)}; }

let DB = (function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const d=JSON.parse(raw);
    const base=defaultDB();
    base.beans=(Array.isArray(d.beans)?d.beans:[]).filter(x=>x&&typeof x==='object');
    base.brews=(Array.isArray(d.brews)?d.brews:[]).filter(x=>x&&typeof x==='object');
    base.experiences=(Array.isArray(d.experiences)?d.experiences:[]).filter(x=>x&&typeof x==='object');
    base.recipes=(Array.isArray(d.recipes)?d.recipes:[]).filter(x=>x&&typeof x==='object');
    base.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});
    if (!Array.isArray(base.settings.customThemes)) base.settings.customThemes = [];
    if (!Array.isArray(base.settings.historyColors)) base.settings.historyColors = [];
    return base;
  }catch(e){ return defaultDB(); }
})();

function save(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }
  catch(e){ toast('保存失败：存储空间可能已满'); }
}

const state={tab:'home',beanFilter:'all',beanSearch:'',recipeFilter:'all',recipeSearch:'',logFilter:'all',logSearch:'',statsMonth:null,openSwipeId:null};

function applyTheme(){
  const themeId = DB.settings.theme || 'euro-pink';
  const customThemes = DB.settings.customThemes || [];
  const custom = customThemes.find(t => t.id === themeId);
  const presetIds = ['euro-pink', 'euro-blue', 'euro-green', 'euro-gold', 'euro-purple', 'dark'];

  if (custom) {
    document.documentElement.removeAttribute('data-theme');
    const bg = custom.bg || '#F6E8EA'; const card = custom.card || '#FFFFFF';
    let title = custom.title || '#673D47'; const accent = custom.accent || '#B34C4E';
    const card2 = mixColors(card, bg, 0.7);
    let text = mixColors(title, bg, 0.7); let dim = mixColors(title, bg, 0.4);
    const border = mixColors(accent, bg, 0.15); const fabBg = accent;
    const shadow = `0 2px 10px ${mixColors(title, bg, 0.08)}`;
    let fabFg = getLuminance(accent) > 0.5 ? '#000000' : '#FFFFFF';
    if (getContrast(bg, title) < 4.5) { title = getLuminance(bg) > 0.5 ? '#000000' : '#FFFFFF'; text = mixColors(title, bg, 0.7); dim = mixColors(title, bg, 0.4); }
    if (getContrast(bg, text) < 4.5) { text = getLuminance(bg) > 0.5 ? '#1A1A1A' : '#E6EAF2'; dim = mixColors(text, bg, 0.5); }
    const root = document.documentElement;
    root.style.setProperty('--bg', bg); root.style.setProperty('--card', card); root.style.setProperty('--card2', card2);
    root.style.setProperty('--text', text); root.style.setProperty('--dim', dim); root.style.setProperty('--title', title);
    root.style.setProperty('--accent', accent); root.style.setProperty('--border', border);
    root.style.setProperty('--fab-bg', fabBg); root.style.setProperty('--fab-fg', fabFg);
    root.style.setProperty('--shadow', shadow); root.style.setProperty('--r', '16px');
  } else {
    let finalThemeId = themeId;
    if (!presetIds.includes(themeId)) { finalThemeId = 'euro-pink'; DB.settings.theme = 'euro-pink'; }
    document.documentElement.setAttribute('data-theme', finalThemeId);
    const root = document.documentElement;
    ['--bg','--card','--card2','--text','--dim','--title','--accent','--border','--fab-bg','--fab-fg','--shadow'].forEach(p => root.style.removeProperty(p));
    root.style.setProperty('--r', '16px');
  }
  document.querySelector('meta[name="theme-color"]').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
}

return h; }

function viewBeans(){ const filters=[['all','全部'],['在喝','在喝'],['囤豆中','囤豆中'],['喝完','喝完']]; const q=state.beanSearch.trim().toLowerCase(); let list=DB.beans.slice().filter(b=>b&&typeof b==='object'); if(state.beanFilter!=='all') list=list.filter(b=>b.status===state.beanFilter); if(q) list=list.filter(b=>[b.name,b.roaster,b.origin,b.variety,b.process,b.roastLevel,b.flavor].map(v=>String(v||'')).join(' ').toLowerCase().includes(q));

function viewStats(){ const m=String(state.statsMonth||curMonth()); const [y,mo]=m.split('-').map(v=>parseInt(v)||0); const now=new Date(); const isCur=(m===curMonth()); const daysInMonth=new Date(y,mo,0).getDate(); const dayCount=isCur?now.getDate():daysInMonth; const brews=DB.brews.filter(b=>(String(b.date||'')).startsWith(m)); const exps=DB.experiences.filter(e=>(String(e.date||'')).startsWith(m)); const boughtBeans=DB.beans.filter(b=>(String(b.purchaseDate||'')).startsWith(m));
const totalDose=brews.reduce((s,b)=>s+num(b.dose),0); const totalBuy=boughtBeans.reduce((s,b)=>s+num(b.price),0); const buyWeight=boughtBeans.reduce((s,b)=>s+num(b.weight),0); const avgPerG=buyWeight>0?(totalBuy/buyWeight):0; const perDay=dayCount>0?(totalDose/dayCount):0;
const recipeCount={}; brews.forEach(b=>{const k=String(b.recipeName||b.method||'未命名');recipeCount[k]=(recipeCount[k]||0)+1;}); const topRecipes=Object.entries(recipeCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
const beanCount={}; DB.beans.forEach(b=>{ let count = 1; if (b.purchases && Array.isArray(b.purchases) && b.purchases.length > 0) count = b.purchases.length; if(b.name) beanCount[String(b.name)]=(beanCount[String(b.name)]||0)+count; }); const topBeans=Object.entries(beanCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
const originCount={}; DB.beans.forEach(b=>{ if(b.origin){ const originStr = String(b.origin); let country='其他'; for(let c of BEAN_COUNTRIES){ if(originStr.includes(c)){ country=c; break; } } if(country==='其他'){ const parts=originStr.split(/[\s\/,，]+/); country=parts[0]||'其他'; } originCount[country]=(originCount[country]||0)+1; } }); const topOrigins=Object.entries(originCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
const processCount={}; DB.beans.forEach(b=>{if(b.process){const p=String(b.process); processCount[p]=(processCount[p]||0)+1;}}); const topProcess=Object.entries(processCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
let h='<div class="field" style="margin-bottom:14px"><div class="auto-val" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" data-action="open-month-picker"><span>'+esc(m)+'</span><span class="ic-sm">'+ICON.chevron+'</span></div></div>';
h+='<div class="stat-big"><div class="label">'+esc(m)+' 总消耗</div><div class="stat-grid"><div><b>'+money(totalBuy)+'</b><span>总花费</span></div><div><b>'+perDay.toFixed(1)+'g</b><span>日均消耗</span></div><div><b>'+(avgPerG?avgPerG.toFixed(2):'—')+'</b><span>平均克价</span></div></div><div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)"><span>本月冲煮 <b style="color:var(--title)">'+brews.length+'</b> 次</span><span>累计粉量 <b style="color:var(--title)">'+totalDose.toFixed(1)+'g</b></span><span>门店体验 <b style="color:var(--title)">'+exps.length+'</b> 次</span></div></div>';
h+='<div class="sec-title">本月买豆总金额</div><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:26px;font-weight:800;color:var(--title)">'+money(totalBuy)+'</div><div style="font-size:12px;color:var(--dim);margin-top:2px">'+boughtBeans.length+' 笔购买 · 合计 '+(buyWeight?buyWeight:'0')+'g</div></div></div>';
h+=bars('常用方案',topRecipes,'次'); h+=bars('常买豆子',topBeans,'次'); h+=bars('产地分布',topOrigins,'款'); h+=bars('处理法',topProcess,'款');
h+='<div class="sec-title">年度消费统计（'+y+'）</div><div class="card"><div class="chart-container">'; const yearData=[]; let maxVal=0;
for(let i=1;i<=12;i++){ const mStr=y+'-'+pad2(i); const buy=DB.beans.filter(b=>(String(b.purchaseDate||'')).startsWith(mStr)).reduce((s,b)=>s+num(b.price),0); const exp=DB.experiences.filter(e=>(String(e.date||'')).startsWith(mStr)).reduce((s,e)=>s+num(e.price),0); yearData.push({m:i,buy,exp}); if(buy>maxVal)maxVal=buy; if(exp>maxVal)maxVal=exp; }
if(maxVal===0)maxVal=1; yearData.forEach(d=>{ const buyH=(d.buy/maxVal)*100; const expH=(d.exp/maxVal)*100; h+='<div class="chart-col"><div class="chart-bars"><div class="chart-bar buy" style="height:'+buyH+'%" title="买豆 ¥'+d.buy.toFixed(0)+'"></div><div class="chart-bar exp" style="height:'+expH+'%" title="门店 ¥'+d.exp.toFixed(0)+'"></div></div><div class="chart-label">'+d.m+'月</div></div>'; });
h+='</div><div style="display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--dim);margin-top:8px"><span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px"></span>买豆</span><span><span style="display:inline-block;width:10px;height:10px;background:var(--title);opacity:0.6;border-radius:2px;margin-right:4px"></span>门店</span></div></div>'; return h; }

  let html = modalHead(isEdit ? '编辑自定义主题' : '创建自定义主题')+'<div class="field"><label>主题名称</label><input class="input" id="themeNameInput" value="'+esc(theme.name)+'" placeholder="例如：我的秋日私语"></div><div class="color-input-row"><label>背景色</label><input type="color" id="colorBg" value="'+theme.bg+'"><input type="text" id="hexBg" value="'+theme.bg+'" maxlength="7" placeholder="#FFFFFF"></div><div class="color-input-row"><label>卡片色</label><input type="color" id="colorCard" value="'+theme.card+'"><input type="text" id="hexCard" value="'+theme.card+'" maxlength="7" placeholder="#FFFFFF"></div><div class="color-input-row"><label>标题色</label><input type="color" id="colorTitle" value="'+theme.title+'"><input type="text" id="hexTitle" value="'+theme.title+'" maxlength="7" placeholder="#000000"></div><div class="color-input-row"><label>强调色</label><input type="color" id="colorAccent" value="'+theme.accent+'"><input type="text" id="hexAccent" value="'+theme.accent+'" maxlength="7" placeholder="#000000"></div><div class="sec-title" style="margin-top:16px">历史色号（最多10个）</div><div class="hint" style="margin-bottom:6px">点击下方色块快速填入上方选择器，长按可锁定或删除</div><div class="history-colors" id="historyColors"></div><div class="sec-title">实时预览</div><div class="preview-card"><div class="p-title">耶加雪菲</div><div class="p-text">这是一段正文示例，展示文字颜色。</div><div class="p-dim">这是一段次要文字，用于辅助信息。</div><div class="p-btn">保存按钮</div></div><div class="btn-row">'+(isEdit ? '<button class="btn btn-danger" data-action="delete-custom-theme" data-id="'+theme.id+'">删除主题</button>' : '')+'<button class="btn" data-action="save-custom-theme" data-id="'+(isEdit ? theme.id : '')+'">保存并应用</button></div>';
  openModal(html);
  setTimeout(()=>{
    const bindColorSync = (colorId, hexId) => { const colorInput = $('#'+colorId); const hexInput = $('#'+hexId); if (colorInput && hexInput) { colorInput.addEventListener('input', () => { hexInput.value = colorInput.value.toUpperCase(); updatePreview(); addHistoryColor(colorInput.value); }); hexInput.addEventListener('input', () => { if (/^#[0-9A-F]{6}$/i.test(hexInput.value)) { colorInput.value = hexInput.value; updatePreview(); addHistoryColor(hexInput.value); } }); } };
    bindColorSync('colorBg', 'hexBg'); bindColorSync('colorCard', 'hexCard'); bindColorSync('colorTitle', 'hexTitle'); bindColorSync('colorAccent', 'hexAccent');
    const updatePreview = () => { const bg = normalizeHex($('#hexBg').value); const card = normalizeHex($('#hexCard').value); const title = normalizeHex($('#hexTitle').value); const accent = normalizeHex($('#hexAccent').value); const preview = $('.preview-card'); if (preview) { let text = mixColors(title, bg, 0.7); let dim = mixColors(title, bg, 0.4); const fabFg = getLuminance(accent) > 0.5 ? '#000000' : '#FFFFFF'; if (getContrast(bg, title) < 4.5) { text = getLuminance(bg) > 0.5 ? '#000000' : '#FFFFFF'; dim = mixColors(text, bg, 0.5); } if (getContrast(bg, text) < 4.5) { text = getLuminance(bg) > 0.5 ? '#1A1A1A' : '#E6EAF2'; dim = mixColors(text, bg, 0.5); } preview.style.background = card; preview.style.borderColor = mixColors(accent, bg, 0.15); preview.querySelector('.p-title').style.color = title; preview.querySelector('.p-text').style.color = text; preview.querySelector('.p-dim').style.color = dim; preview.querySelector('.p-btn').style.background = accent; preview.querySelector('.p-btn').style.color = fabFg; preview.style.boxShadow = `0 2px 10px ${mixColors(title, bg, 0.08)}`; } };
    function renderHistoryColors() { const container = $('#historyColors'); if (!container) return; const colors = DB.settings.historyColors || []; container.innerHTML = colors.map((c, i) => '<div class="history-color-box '+(c.locked?'locked':'')+'" data-index="'+i+'" style="background:'+c.color+'">'+(c.locked ? '<div class="lock-icon">🔒</div>' : '')+'</div>').join(''); }
    let historySaveTimer = null;
    function addHistoryColor(color) { if (!/^#[0-9A-F]{6}$/i.test(color)) return; color = color.toUpperCase(); let colors = DB.settings.historyColors || []; const existIdx = colors.findIndex(c => c.color === color); if (existIdx !== -1) { const [item] = colors.splice(existIdx, 1); colors.push(item); } else { colors.push({ color: color, locked: false }); } while (colors.length > 10) { const idx = colors.findIndex(c => !c.locked); if (idx !== -1) { colors.splice(idx, 1); } else { break; } } DB.settings.historyColors = colors; clearTimeout(historySaveTimer); historySaveTimer = setTimeout(() => { save(); renderHistoryColors(); }, 500); }
    renderHistoryColors(); updatePreview();
    let longPressTimer = null; let activeMenu = null;
    $('#historyColors').addEventListener('touchstart', (e) => { const box = e.target.closest('.history-color-box'); if (!box) return; longPressTimer = setTimeout(() => { const idx = parseInt(box.dataset.index); const colors = DB.settings.historyColors || []; const item = colors[idx]; if (!item) return; if (activeMenu) activeMenu.remove(); const rect = box.getBoundingClientRect(); const menu = document.createElement('div'); menu.className = 'color-bubble-menu'; menu.style.left = (rect.left - 20) + 'px'; menu.style.top = (rect.top - 44) + 'px'; menu.innerHTML = `<button class="bubble-lock">${item.locked ? '解锁' : '锁定'}</button><button class="bubble-del">删除</button>`; menu.querySelector('.bubble-lock').addEventListener('click', () => { item.locked = !item.locked; save(); renderHistoryColors(); menu.remove(); activeMenu = null; }); menu.querySelector('.bubble-del').addEventListener('click', () => { colors.splice(idx, 1); save(); renderHistoryColors(); menu.remove(); activeMenu = null; }); document.body.appendChild(menu); activeMenu = menu; }, 600); }, { passive: true });
    $('#historyColors').addEventListener('touchend', () => { clearTimeout(longPressTimer); });
    $('#historyColors').addEventListener('touchmove', () => { clearTimeout(longPressTimer); });
    $('#historyColors').addEventListener('click', (e) => { const box = e.target.closest('.history-color-box'); if (!box) return; const idx = parseInt(box.dataset.index); const colors = DB.settings.historyColors || []; const item = colors[idx]; if (item) { $('#hexBg').value = item.color; $('#colorBg').value = item.color; updatePreview(); } });
    document.addEventListener('click', function closeMenu(ev) { if (activeMenu && !ev.target.closest('.color-bubble-menu') && !ev.target.closest('.history-color-box')) { activeMenu.remove(); activeMenu = null; } });
    document.querySelector('.color-bubble-menu')?.addEventListener('click', e => e.stopPropagation());
  }, 100);
}

function showConfirm(title, message, onConfirm) { const overlay = $('#confirmOverlay'); overlay.innerHTML = `<div class="confirm-box"><h4>${title}</h4><p>${message}</p><div class="confirm-btns"><button class="confirm-cancel">取消</button><button class="confirm-delete">删除</button></div></div>`; overlay.classList.add('show'); overlay.querySelector('.confirm-cancel').addEventListener('click', () => { overlay.classList.remove('show'); overlay.innerHTML = ''; }); overlay.querySelector('.confirm-delete').addEventListener('click', () => { overlay.classList.remove('show'); overlay.innerHTML = ''; onConfirm(); }); overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.classList.remove('show'); overlay.innerHTML = ''; } }); }

document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-action]'); if(!el)return;
  const action=el.dataset.action; const id=el.dataset.id;
  switch(action){
    case 'tab':state.tab=el.dataset.tab;state.openSwipeId=null;render();break;
    case 'open-log-add':openLogAddSheet();break;
    case 'settings':openSettings();break;
    case 'close-modal':closeModal();break;
    case 'star':{ const wrap=el.closest('.stars'); const val=Number(el.dataset.val); const cur=Number(wrap.dataset.value)||0; const next=(cur===val)?0:val; wrap.dataset.value=next; $$('.star',wrap).forEach((s,i)=>{ s.classList.toggle('on',(i+1)<=next); }); break; }
    case 'seg-set':{ const target=el.dataset.target; const v=el.dataset.v; const seg=el.parentElement; $$('button',seg).forEach(b=>b.classList.toggle('on',b===el)); const hidden=seg.parentElement.querySelector('input[type="hidden"][name="'+target+'"]'); if(hidden)hidden.value=v; break; }
    case 'open-month-picker':openMonthPicker();break;
    case 'month-year':{ const cur=($('#pickerYear').textContent||'2026'); const next=parseInt(cur)+parseInt(el.dataset.v); $('#pickerYear').textContent=next; break; }
    case 'month-pick':{ const y=$('#pickerYear').textContent; const m=el.dataset.v.padStart(2,'0'); state.statsMonth=y+'-'+m; closeModal(); render(); break; }
    case 'new-bean':closeModal();setTimeout(()=>openBeanForm(),120);break;
    case 'view-bean':{state.openSwipeId=null;viewBeanDetail(id);}break;
    case 'edit-bean':state.openSwipeId=null;closeModal();setTimeout(()=>openBeanForm(id),120);break;
    case 'bean-sort':DB.settings.beanSort=(DB.settings.beanSort==='desc')?'asc':'desc';save();render();break;
    case 'save-bean':{ const d=readForm(); if(!d.name){toast('请填写品名');return;} if(d.blend){ const rows=$$('#blendList .blend-row');const blendArr=[]; rows.forEach(r=>{ const inputs=r.querySelectorAll('input'); const origin=inputs[0].value.trim();const variety=inputs[1].value.trim();const process=inputs[2].value.trim(); if(origin||variety||process){blendArr.push({origin,variety,process});} }); d.blendInfo=JSON.stringify(blendArr); if(blendArr.length>0){ d.origin=blendArr.map(x=>x.origin).filter(Boolean).join(' / '); d.variety=blendArr.map(x=>x.variety).filter(Boolean).join(' / '); d.process=blendArr.map(x=>x.process).filter(Boolean).join(' / '); } }else{d.blendInfo='';} if(d.purchases&&d.purchases.length>0){const latest=d.purchases.reduce((a,b)=>(a.date>b.date?a:b));d.purchaseDate=latest.date;d.price=latest.price;d.weight=latest.weight;} if(id){const b=DB.beans.find(x=>x.id===id);Object.assign(b,d);}else{d.id=uid();d.createdAt=Date.now();DB.beans.push(d);} save();closeModal();render();toast('已保存'); break; }
    case 'delete-bean':{if(!confirm('确定删除这款豆子吗？'))return;DB.beans=DB.beans.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
    case 'new-brew':closeModal();setTimeout(()=>openBrewForm(),120);break;
    case 'view-brew':{state.openSwipeId=null;viewBrewDetail(id);}break;
    case 'edit-brew':state.openSwipeId=null;closeModal();setTimeout(()=>openBrewForm(id),120);break;
    case 'save-brew':{ const d=readForm(); if(d.beanId){const bean=DB.beans.find(x=>x.id===d.beanId);if(bean)d.beanName=bean.name||'';} if(!d.beanName){toast('请选择或输入豆子');return;} if(!d.date)d.date=todayStr(); if(d.friendShare){ let friendBean=DB.beans.find(x=>x.tag==='friend'&&x.name===d.beanName); if(!friendBean){ friendBean={id:uid(),name:d.beanName,tag:'friend',status:'在喝',blend:false,createdAt:Date.now()}; DB.beans.push(friendBean); } d.beanId=friendBean.id; } if(id){Object.assign(DB.brews.find(x=>x.id===id),d);}else{d.id=uid();d.createdAt=Date.now();DB.brews.push(d);} save();closeModal();render();toast('已保存'); break; }
    case 'delete-brew':{if(!confirm('确定删除这条冲煮记录吗？'))return;DB.brews=DB.brews.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
    case 'new-experience':closeModal();setTimeout(()=>openExpForm(),120);break;
    case 'view-exp':{state.openSwipeId=null;viewExpDetail(id);}break;
    case 'edit-exp':state.openSwipeId=null;closeModal();setTimeout(()=>openExpForm(id),120);break;
    case 'save-exp':{const d=readForm();if(!d.date)d.date=todayStr();if(id){Object.assign(DB.experiences.find(x=>x.id===id),d);}else{d.id=uid();d.createdAt=Date.now();DB.experiences.push(d);}save();closeModal();render();toast('已保存');break;}
    case 'delete-exp':{if(!confirm('确定删除这条体验记录吗？'))return;DB.experiences=DB.experiences.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
    case 'new-recipe':closeModal();setTimeout(()=>openRecipeForm(),120);break;
    case 'view-recipe':{state.openSwipeId=null;viewRecipeDetail(id);}break;
    case 'edit-recipe':state.openSwipeId=null;closeModal();setTimeout(()=>openRecipeForm(id),120);break;
    case 'toggle-top-recipe':{const r=DB.recipes.find(x=>x.id===id);if(r){r.isTop=!r.isTop;save();state.openSwipeId=null;render();toast(r.isTop?'已置顶':'已取消置顶');}break;}
    case 'save-recipe':{const d=readForm();if(!d.name){toast('请填写方案名称');return;}if(id){Object.assign(DB.recipes.find(x=>x.id===id),d);}else{d.id=uid();d.createdAt=Date.now();DB.recipes.push(d);}save();closeModal();render();toast('已保存');break;}
    case 'delete-recipe':{if(!confirm('确定删除这个方案吗？'))return;DB.recipes=DB.recipes.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
    case 'bean-filter':state.beanFilter=el.dataset.v;state.openSwipeId=null;render();break;
    case 'bean-view':DB.settings.beanView=el.dataset.v;save();state.openSwipeId=null;render();break;
    case 'recipe-filter':state.recipeFilter=el.dataset.v;state.openSwipeId=null;render();break;
    case 'recipe-view':DB.settings.recipeView=el.dataset.v;save();state.openSwipeId=null;render();break;
    case 'log-filter':state.logFilter=el.dataset.v;state.openSwipeId=null;render();break;
    case 'save-app-name':{const inp=$('#appNameInput');if(inp){DB.settings.appName=inp.value.trim()||'西洋豆浆萃';save();closeModal();render();toast('名称已保存');}break;}
    case 'set-theme':DB.settings.theme=el.dataset.v;save();applyTheme();openSettings();toast('主题已切换');break;
    case 'apply-custom-theme':DB.settings.theme=el.dataset.id;save();applyTheme();openSettings();toast('已应用自定义主题');break;
    case 'create-custom-theme':{ if(DB.settings.customThemes.length>=6){toast('最多只能保存6个自定义主题');return;} openThemeEditor(); }break;
    case 'edit-custom-theme':openThemeEditor(el.dataset.id);break;
    case 'delete-custom-theme':{ const themeId = el.dataset.id; const theme = DB.settings.customThemes.find(t=>t.id===themeId); if(!theme) return; showConfirm('删除主题', '确定要删除「'+esc(theme.name)+'」主题吗？此操作不可恢复。', () => { DB.settings.customThemes = DB.settings.customThemes.filter(t=>t.id!==themeId); if (DB.settings.theme === themeId) DB.settings.theme = 'euro-pink'; save(); applyTheme(); closeModal(); render(); toast('主题已删除'); }); break; }
    case 'save-custom-theme':{ const nameInp = $('#themeNameInput'); let name = nameInp ? nameInp.value.trim() : ''; if (!name) name = '自定义主题 ' + (DB.settings.customThemes.length + 1); let bg = normalizeHex($('#hexBg')?.value || $('#colorBg')?.value || '#F6E8EA'); let card = normalizeHex($('#hexCard')?.value || $('#colorCard')?.value || '#FFFFFF'); let title = normalizeHex($('#hexTitle')?.value || $('#colorTitle')?.value || '#673D47'); let accent = normalizeHex($('#hexAccent')?.value || $('#colorAccent')?.value || '#B34C4E'); const newTheme = { id: id || ('t_'+uid()), name, bg, card, title, accent }; if (id) { const idx = DB.settings.customThemes.findIndex(t=>t.id===id); if (idx !== -1) DB.settings.customThemes[idx] = newTheme; } else { DB.settings.customThemes.push(newTheme); } DB.settings.theme = newTheme.id; save(); applyTheme(); closeModal(); render(); toast('主题已保存并应用'); break; }
    case 'copy-export': { const ta = $('#exportArea'); if (ta) { ta.select(); ta.setSelectionRange(0, 999999); try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(() => toast('已复制到剪贴板')).catch(() => { document.execCommand('copy'); toast('已复制到剪贴板'); }); } else { document.execCommand('copy'); toast('已复制到剪贴板'); } } catch (e) { toast('复制失败，请长按文本框手动复制'); } } break; }
    case 'do-import': { const ta = $('#importArea'); if (!ta || !ta.value.trim()) { toast('请先粘贴内容'); return; } try { const d = JSON.parse(ta.value); const base = defaultDB(); base.beans = (Array.isArray(d.beans) ? d.beans : []).filter(x => x && typeof x === 'object'); base.brews = (Array.isArray(d.brews) ? d.brews : []).filter(x => x && typeof x === 'object'); base.experiences = (Array.isArray(d.experiences) ? d.experiences : []).filter(x => x && typeof x === 'object'); base.recipes = (Array.isArray(d.recipes) ? d.recipes : []).filter(x => x && typeof x === 'object'); base.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}); if (!Array.isArray(base.settings.customThemes)) base.settings.customThemes = []; if (!Array.isArray(base.settings.historyColors)) base.settings.historyColors = []; DB = base; save(); toast('导入成功，正在刷新设置界面...'); setTimeout(() => { openSettings(); }, 500); } catch (e) { toast('格式错误，导入失败：' + e.message); } break; }
    case 'clear-data':{if(!confirm('确定清空全部数据吗？此操作不可恢复。'))return;if(!confirm('再次确认：真的要清空所有记录吗？'))return;DB=defaultDB();save();closeModal();render();toast('已清空');break;}
  }
});

let touchStartX=0,touchStartY=0,touchCurrentX=0,touchCurrentY=0,isSwiping=false,swipeTarget=null;
document.addEventListener('touchstart',e=>{const card=e.target.closest('.swipe-card');if(!card)return;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;touchCurrentX=touchStartX;touchCurrentY=touchStartY;isSwiping=false;swipeTarget=card;},{passive:true});
document.addEventListener('touchmove',e=>{if(!swipeTarget)return;touchCurrentX=e.touches[0].clientX;touchCurrentY=e.touches[0].clientY;const dx=touchCurrentX-touchStartX;const dy=touchCurrentY-touchStartY;if(Math.abs(dx)>10&&Math.abs(dy)<30){isSwiping=true;if(dx<0){swipeTarget.style.transform='translateX('+Math.max(dx,swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')?-192:-128)+'px)';}else if(swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')){swipeTarget.style.transform='translateX('+Math.min(dx-(swipeTarget.classList.contains('swiped')?192:128),0)+'px)';}}},{passive:true});
document.addEventListener('touchend',e=>{if(!swipeTarget)return;const dx=touchCurrentX-touchStartX;const dy=touchCurrentY-touchStartY;if(isSwiping&&Math.abs(dx)>40&&Math.abs(dy)<30){if(dx<0){swipeTarget.classList.add(swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')?'swiped':'swiped-2');swipeTarget.style.transform='';}else{swipeTarget.classList.remove('swiped','swiped-2');swipeTarget.style.transform='';}}else if(swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')){swipeTarget.style.transform='';}else{swipeTarget.style.transform='';}setTimeout(()=>{if(swipeTarget){swipeTarget.style.transform='';swipeTarget=null;isSwiping=false;}},50);},{passive:true});
