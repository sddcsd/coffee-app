<!DOCTYPE html>
<html lang="zh-CN" data-theme="euro-pink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6E8EA">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>西洋豆浆萃</title>
<style>
:root, [data-theme="euro-pink"]{--bg:#F6E8EA;--card:#FFFFFF;--card2:#F9E8E9;--text:#3A2022;--dim:#A8787A;--title:#673D47;--accent:#B34C4E;--border:rgba(103,61,71,.1);--fab-bg:#673D47;--fab-fg:#F9E8E9;--shadow:0 2px 10px rgba(103,61,71,.08);--r:16px;}
[data-theme="euro-blue"]{--bg:#E8EFF4;--card:#FFFFFF;--card2:#E6EFF6;--text:#1B2A38;--dim:#7A93A8;--title:#29475F;--accent:#326FAD;--border:rgba(41,71,95,.1);--fab-bg:#29475F;--fab-fg:#E6EFF6;--shadow:0 2px 10px rgba(41,71,95,.08);}
[data-theme="euro-green"]{--bg:#E7EFEA;--card:#FFFFFF;--card2:#E4F0E8;--text:#1C2E25;--dim:#7A9987;--title:#2D5044;--accent:#347B59;--border:rgba(45,80,68,.1);--fab-bg:#2D5044;--fab-fg:#E4F0E8;--shadow:0 2px 10px rgba(45,80,68,.08);}
[data-theme="euro-gold"]{--bg:#F7F0E5;--card:#FFFFFF;--card2:#FAF0DF;--text:#332B21;--dim:#A8957C;--title:#65513B;--accent:#BA8B36;--border:rgba(101,81,59,.1);--fab-bg:#65513B;--fab-fg:#FAF0DF;--shadow:0 2px 10px rgba(101,81,59,.08);}
[data-theme="euro-purple"]{--bg:#EFEAF2;--card:#FFFFFF;--card2:#EFE8F4;--text:#2A2133;--dim:#9182A3;--title:#513B68;--accent:#75529E;--border:rgba(81,59,104,.1);--fab-bg:#513B68;--fab-fg:#EFE8F4;--shadow:0 2px 10px rgba(81,59,104,.08);}
[data-theme="dark"]{--bg:#161823;--card:#1E2130;--card2:#232739;--text:#E6EAF2;--dim:#8B93A8;--title:#B8CEE2;--accent:#53589A;--border:rgba(184,206,226,.16);--fab-bg:#53589A;--fab-fg:#E6EAF2;--shadow:0 2px 10px rgba(0,0,0,.35);}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}button{border:none;background:none;cursor:pointer;padding:0;}svg{width:100%;height:100%;display:block;}
.ic{width:22px;height:22px;flex:none;}.ic-sm{width:18px;height:18px;flex:none;}.ic-lg{width:30px;height:30px;flex:none;}.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 10px;min-height:56px;background:var(--bg);transition:background .3s;}
.brand{font-size:20px;font-weight:800;color:var(--title);letter-spacing:.5px;}.tb-title{font-size:19px;font-weight:700;color:var(--title);}.tb-right{display:flex;gap:6px;align-items:center;}
.icon-btn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--title);background:transparent;flex:none;}
.icon-btn:active{background:var(--card2);}.icon-btn .ic{width:18px;height:18px;}

.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}.view::-webkit-scrollbar{display:none;}
.tabbar{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.05);position:relative;z-index:20;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);padding:4px 0;transition:color .18s;}.tab .tab-icon{width:24px;height:24px;transition:transform .2s;}.tab.active{color:var(--title);}.tab.active .tab-icon{transform:translateY(-1px) scale(1.06);}.tab-label{font-size:10.5px;font-weight:600;letter-spacing:.2px;}

.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);transition:transform .2s;position:relative;overflow:hidden;}
.hero{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border-radius:20px;padding:20px 18px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);}
.hero-title{font-size:17px;font-weight:800;color:var(--title);margin-bottom:2px;}.hero-sub{font-size:12.5px;color:var(--dim);margin-bottom:16px;}.hero-stats{display:flex;justify-content:space-between;}.hero-stats>div{flex:1;text-align:center;display:flex;flex-direction:column;gap:2px;}.hero-stats b{font-size:19px;color:var(--title);font-weight:800;}.hero-stats span{font-size:11px;color:var(--dim);}

.sec-title{font-size:14px;font-weight:700;color:var(--title);margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between;}.sec-title .more{font-size:12px;font-weight:500;color:var(--dim);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--fab-bg);color:var(--fab-fg);transition:opacity .15s;}.btn:active{opacity:.8;}
.btn-ghost{background:var(--card2);color:var(--title);border:1px solid var(--border);}.btn-danger{background:#C0392B;color:#fff;}.btn-block{width:100%;}.btn-row{display:flex;gap:10px;margin-top:18px;}.btn-row .btn{flex:1;}
.btn-fab-bottom{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--fab-bg);color:var(--fab-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:90;padding:0;margin:0;}.btn-fab-bottom .ic{width:28px;height:28px;}

.field{margin-bottom:14px;}.field label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:6px;letter-spacing:.2px;}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--text);outline:none;transition:border-color .15s;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);}.textarea{min-height:80px;resize:vertical;line-height:1.55;}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}.auto-val{padding:11px 13px;border-radius:12px;background:var(--card2);border:1px dashed var(--border);color:var(--title);font-weight:700;}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px;}

.switch{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}.switch input{display:none;}
.switch .track{width:46px;height:27px;border-radius:14px;background:var(--border);position:relative;transition:background .2s;flex:none;}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + .track{background:var(--accent);}.switch input:checked + .track::after{transform:translateX(19px);}

.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;border:1px solid var(--border);}.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--dim);transition:all .15s;}.seg button.on{background:var(--card);color:var(--title);box-shadow:0 1px 4px rgba(0,0,0,.08);}

.stars{display:flex;gap:1px;}.star{font-size:20px;line-height:1;color:var(--border);transition:transform .12s,color .12s;padding:0 1px;}.star.on{color:var(--accent);}.star:active{transform:scale(1.2);}

.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;background:var(--card2);color:var(--dim);margin:0 2px;}.tag-accent{background:var(--accent);color:#fff;}.tag-title{background:var(--title);color:var(--card);}.tag-friend{background:var(--card2);color:var(--accent);border:1px solid var(--border);}

.swipe-container{position:relative;overflow:hidden;margin-bottom:12px;border-radius:var(--r);}
.swipe-actions{position:absolute;top:0;right:0;height:100%;display:flex;z-index:1;}
.swipe-actions button{width:64px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;gap:4px;border:none;}
.swipe-actions .swipe-edit{background:var(--accent);}.swipe-actions .swipe-top{background:var(--title);}.swipe-actions .swipe-del{background:#C0392B;}
.swipe-card{position:relative;z-index:2;transform:translateX(0);transition:transform .25s cubic-bezier(.2,.8,.3,1);background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:14px;cursor:pointer;}
.swipe-card.swiped{transform:translateX(-192px);}
.swipe-card.swiped-2{transform:translateX(-128px);}

.bc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}.bc-name{font-size:16.5px;font-weight:800;color:var(--title);line-height:1.3;}.bc-sub{font-size:12.5px;color:var(--dim);margin-bottom:8px;}
.bc-meta{font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 12px;}.bc-meta b{color:var(--text);font-weight:600;}.bc-tags{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;}
.bc-lite{display:flex;justify-content:space-between;align-items:center;}.bc-lite .bc-name{font-size:15px;}

.empty{text-align:center;padding:50px 20px;color:var(--dim);}.empty .ic-lg{width:44px;height:44px;margin:0 auto 12px;opacity:.4;}.empty p{font-size:13.5px;margin:0 0 16px;}
.top-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}.top-controls .seg{flex:1;max-width:200px;}
.sort-btn{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--title);flex:none;}.sort-btn .ic-sm{width:18px;height:18px;}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--shadow);}.searchbar input{flex:1;border:none;background:transparent;outline:none;}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;flex:1;-ms-overflow-style:none;scrollbar-width:none;}.chips::-webkit-scrollbar{display:none;}.chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--card);color:var(--dim);border:1px solid var(--border);}.chip.on{background:var(--title);color:var(--card);border-color:var(--title);}

.modal{position:fixed;inset:0;z-index:100;display:none;}.modal.show{display:block;}.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s;}.modal-panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.3,1);}.modal-panel::-webkit-scrollbar{display:none;}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}.modal-head h3{margin:0;font-size:18px;font-weight:800;color:var(--title);}.modal-close{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;}

@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.add-card{background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s;}.add-card:active{transform:scale(.96);}.add-ic{width:48px;height:48px;color:var(--title);display:flex;align-items:center;justify-content:center;}.add-title{font-size:14.5px;font-weight:800;color:var(--title);}.add-sub{font-size:11px;color:var(--dim);}

.dl{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}.dl:last-child{border-bottom:none;}.dl dt{color:var(--dim);flex:none;font-weight:600;}.dl dd{margin:0;text-align:right;color:var(--text);word-break:break-all;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:12px;}.info-item{padding:8px 10px;background:var(--card2);border-radius:10px;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;}
.info-item .label{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:2px;}.info-item .value{font-size:13px;color:var(--text);font-weight:600;word-break:break-all;}

.stat-big{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}.stat-big .label{font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:14px;}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}.stat-grid b{display:block;font-size:19px;color:var(--title);font-weight:800;}.stat-grid span{font-size:11px;color:var(--dim);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}.bar-row .name{width:88px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:600;}.bar-row .bar{flex:1;height:8px;border-radius:5px;background:var(--card2);overflow:hidden;}.bar-row .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s;}.bar-row .val{width:56px;text-align:right;color:var(--dim);font-size:12px;flex:none;}
.chart-container{display:flex;align-items:flex-end;justify-content:space-between;height:160px;padding:10px 0;gap:6px;}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}.chart-bars{flex:1;width:100%;display:flex;justify-content:center;gap:3px;align-items:flex-end;}.chart-bar{width:10px;border-radius:4px 4px 0 0;transition:height .3s;}.chart-bar.buy{background:var(--accent);}.chart-bar.exp{background:var(--title);opacity:0.6;}.chart-label{font-size:9px;color:var(--dim);}

.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:80vw;text-align:center;}.toast.show{opacity:1;transform:translate(-50%,0);}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.theme-item{border-radius:14px;padding:12px;border:2px solid var(--border);display:flex;flex-direction:column;gap:8px;transition:border-color .15s;}.theme-item.on{border-color:var(--title);}.theme-item .swatches{display:flex;gap:5px;}.theme-item .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.08);}.theme-item .tname{font-size:12.5px;font-weight:700;}
.blend-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}.blend-table th,.blend-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;}.blend-table th{background:var(--card2);color:var(--title);font-weight:700;}.blend-table td{color:var(--text);}
.purchase-row{display:grid;grid-template-columns:1fr 1fr 1fr 24px;gap:6px;margin-bottom:6px;align-items:center;}.purchase-row input{padding:8px 10px;font-size:12px;}.purchase-row button{padding:0;width:24px;height:24px;border-radius:50%;font-size:14px;line-height:1;margin:0 auto;}
.month-picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}.month-picker-grid button{padding:12px 0;border-radius:12px;background:var(--card2);color:var(--text);font-weight:700;border:1px solid var(--border);}.month-picker-grid button.on{background:var(--title);color:var(--card);border-color:var(--title);}.year-selector{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 10px;}.year-selector button{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;}.year-selector span{font-size:18px;font-weight:800;color:var(--title);}
.dropdown-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:0 0 12px 12px;box-shadow:0 8px 16px rgba(0,0,0,.1);z-index:50;max-height:180px;overflow-y:auto;display:none;}.dropdown-suggestions.show{display:block;}
.dropdown-suggestions div{padding:10px 13px;font-size:14px;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer;}.dropdown-suggestions div:last-child{border-bottom:none;}.dropdown-suggestions div:active{background:var(--card2);}
</style>
</head>

function viewStats(){const m=state.statsMonth||curMonth();const [y,mo]=m.split('-').map(Number);const now=new Date();const isCur=(m===curMonth());const daysInMonth=new Date(y,mo,0).getDate();const dayCount=isCur?now.getDate():daysInMonth;const brews=DB.brews.filter(b=>(b.date||'').startsWith(m));const exps=DB.experiences.filter(e=>(e.date||'').startsWith(m));const boughtBeans=DB.beans.filter(b=>(b.purchaseDate||'').startsWith(m));
const totalDose=brews.reduce((s,b)=>s+num(b.dose),0);const totalBuy=boughtBeans.reduce((s,b)=>s+num(b.price),0);const buyWeight=boughtBeans.reduce((s,b)=>s+num(b.weight),0);const avgPerG=buyWeight>0?(totalBuy/buyWeight):0;const perDay=dayCount>0?(totalDose/dayCount):0;

function viewRecipeDetail(id){const r=DB.recipes.find(x=>x.id===id);if(!r)return;const infoHtml=`<div class="info-item"><div class="label">关联豆子</div><div class="value">${esc(r.beanName||'—')}</div></div><div class="info-item"><div class="label">滤杯</div><div class="value">${esc(r.dripper||'—')}</div></div><div class="info-item"><div class="label">粉量</div><div class="value">${esc(r.dose?r.dose+' g':'—')}</div></div><div class="info-item"><div class="label">总水量</div><div class="value">${esc(r.water?r.water+' g':'—')}</div></div><div class="info-item"><div class="label">粉水比</div><div class="value">${esc(r.ratio||'—')}</div></div><div class="info-item"><div class="label">水温</div><div class="value">${esc(r.temp?r.temp+' ℃':'—')}</div></div><div class="info-item"><div class="label">研磨度</div><div class="value">${esc(r.grind||'—')}</div></div><div class="info-item"><div class="label">总时长</div><div class="value">${esc(r.totalTime||'—')}</div></div>`;
const html=modalHead(r.name||'方案详情')+'<div style="margin-bottom:14px"><span class="tag '+(r.type==='own'?'tag-accent':'tag-title')+'">'+(r.type==='own'?'我的优化':'收集')+'</span>'+(r.isTop?'<span class="tag tag-accent" style="margin-left:6px">已置顶</span>':'')+'</div><div class="sec-title">方案参数</div><div class="info-grid">'+infoHtml+'</div>'+(r.stages?'<div class="sec-title">注水节奏</div><div class="card" style="white-space:pre-wrap;font-size:13.5px;line-height:1.7">'+esc(r.stages)+'</div>':'')+(r.flavor?'<div class="sec-title">风味</div><div class="card" style="white-space:pre-wrap;font-size:13.5px">'+esc(r.flavor)+'</div>':'')+(r.review?'<div class="sec-title">评价</div><div class="card" style="white-space:pre-wrap;font-size:13.5px;line-height:1.7">'+esc(r.review)+'</div>':'')+'<div class="btn-row"><button class="btn btn-ghost" data-action="edit-recipe" data-id="'+r.id+'">编辑</button><button class="btn" data-action="close-modal">关闭</button></div>';openModal(html);}

function readForm(){const panel=$('#modal .modal-panel');if(!panel)return {};const out={};$$('[name]',panel).forEach(el=>{if(el.type==='checkbox')out[el.name]=el.checked;else out[el.name]=el.value.trim();});$$('.stars',panel).forEach(el=>{out[el.dataset.starName]=Number(el.dataset.value)||0;});const purchaseRows=$$('#purchaseList .purchase-row');const purchases=[];purchaseRows.forEach(row=>{const date=row.querySelector('[data-field="date"]').value;const price=row.querySelector('[data-field="price"]').value.trim();const weight=row.querySelector('[data-field="weight"]').value.trim();if(date||price||weight){purchases.push({date,price,weight});}});out.purchases=purchases;return out;}

let touchStartX=0,touchStartY=0,touchCurrentX=0,touchCurrentY=0,isSwiping=false,swipeTarget=null;
document.addEventListener('touchstart',e=>{const card=e.target.closest('.swipe-card');if(!card)return;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;touchCurrentX=touchStartX;touchCurrentY=touchStartY;isSwiping=false;swipeTarget=card;},{passive:true});
document.addEventListener('touchmove',e=>{if(!swipeTarget)return;touchCurrentX=e.touches[0].clientX;touchCurrentY=e.touches[0].clientY;const dx=touchCurrentX-touchStartX;const dy=touchCurrentY-touchStartY;if(Math.abs(dx)>10&&Math.abs(dy)<30){isSwiping=true;if(dx<0){swipeTarget.style.transform='translateX('+Math.max(dx,swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')?-192:-128)+'px)';}else if(swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')){swipeTarget.style.transform='translateX('+Math.min(dx-(swipeTarget.classList.contains('swiped')?192:128),0)+'px)';}}},{passive:true});
document.addEventListener('touchend',e=>{if(!swipeTarget)return;const dx=touchCurrentX-touchStartX;const dy=touchCurrentY-touchStartY;if(isSwiping&&Math.abs(dx)>40&&Math.abs(dy)<30){if(dx<0){swipeTarget.classList.add(swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')?'swiped':'swiped-2');swipeTarget.style.transform='';}else{swipeTarget.classList.remove('swiped','swiped-2');swipeTarget.style.transform='';}}else if(swipeTarget.classList.contains('swiped')||swipeTarget.classList.contains('swiped-2')){swipeTarget.style.transform='';}else{swipeTarget.style.transform='';}setTimeout(()=>{if(swipeTarget){swipeTarget.style.transform='';swipeTarget=null;isSwiping=false;}},50);},{passive:true});

document.addEventListener('click',function(ev){const el=ev.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;const id=el.dataset.id;
if(isSwiping){isSwiping=false;return;}
switch(action){
case 'tab':state.tab=el.dataset.tab;state.openSwipeId=null;render();break;case 'open-log-add':openLogAddSheet();break;case 'settings':openSettings();break;case 'close-modal':closeModal();break;
case 'star':{const wrap=el.closest('.stars');const val=Number(el.dataset.val);const cur=Number(wrap.dataset.value)||0;const next=(cur===val)?0:val;wrap.dataset.value=next;$$('.star',wrap).forEach((s,i)=>{s.classList.toggle('on',(i+1)<=next);});break;}
case 'seg-set':{const target=el.dataset.target;const v=el.dataset.v;const seg=el.parentElement;$$('button',seg).forEach(b=>b.classList.toggle('on',b===el));const hidden=seg.parentElement.querySelector('input[type="hidden"][name="'+target+'"]');if(hidden)hidden.value=v;break;}
case 'open-month-picker':openMonthPicker();break;case 'month-year':{const cur=($('#pickerYear').textContent||'2026');const next=parseInt(cur)+parseInt(el.dataset.v);$('#pickerYear').textContent=next;break;}case 'month-pick':{const y=$('#pickerYear').textContent;const m=el.dataset.v.padStart(2,'0');state.statsMonth=y+'-'+m;closeModal();render();break;}
case 'new-bean':closeModal();setTimeout(()=>openBeanForm(),120);break;case 'view-bean':{state.openSwipeId=null;viewBeanDetail(id);}break;case 'edit-bean':state.openSwipeId=null;closeModal();setTimeout(()=>openBeanForm(id),120);break;
case 'bean-sort':DB.settings.beanSort=(DB.settings.beanSort==='desc')?'asc':'desc';save();render();break;
case 'save-bean':{const d=readForm();if(!d.name){toast('请填写品名');return;}if(d.blend){const rows=$$('#blendList .blend-row');const blendArr=[];rows.forEach(r=>{const inputs=r.querySelectorAll('input');const origin=inputs[0].value.trim();const variety=inputs[1].value.trim();const process=inputs[2].value.trim();if(origin||variety||process){blendArr.push({origin,variety,process});}});d.blendInfo=JSON.stringify(blendArr);if(blendArr.length>0){d.origin=blendArr.map(x=>x.origin).filter(Boolean).join(' / ');d.variety=blendArr.map(x=>x.variety).filter(Boolean).join(' / ');d.process=blendArr.map(x=>x.process).filter(Boolean).join(' / ');}}else{d.blendInfo='';}if(d.purchases&&d.purchases.length>0){const latest=d.purchases.reduce((a,b)=>(a.date>b.date?a:b));d.purchaseDate=latest.date;d.price=latest.price;d.weight=latest.weight;}if(id){const b=DB.beans.find(x=>x.id===id);Object.assign(b,d);}else{d.id=uid();d.createdAt=Date.now();DB.beans.push(d);}save();closeModal();render();toast('已保存');break;}
case 'delete-bean':{if(!confirm('确定删除这款豆子吗？'))return;DB.beans=DB.beans.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
case 'new-brew':closeModal();setTimeout(()=>openBrewForm(),120);break;case 'view-brew':{state.openSwipeId=null;viewBrewDetail(id);}break;case 'edit-brew':state.openSwipeId=null;closeModal();setTimeout(()=>openBrewForm(id),120);break;
case 'save-brew':{const d=readForm();if(d.beanId){const bean=DB.beans.find(x=>x.id===d.beanId);if(bean)d.beanName=bean.name||'';}if(!d.beanName){toast('请选择或输入豆子');return;}if(!d.date)d.date=todayStr();if(d.friendShare){let friendBean=DB.beans.find(x=>x.tag==='friend'&&x.name===d.beanName);if(!friendBean){friendBean={id:uid(),name:d.beanName,tag:'friend',status:'在喝',blend:false,createdAt:Date.now()};DB.beans.push(friendBean);}d.beanId=friendBean.id;}if(id){Object.assign(DB.brews.find(x=>x.id===id),d);}else{d.id=uid();d.createdAt=Date.now();DB.brews.push(d);}save();closeModal();render();toast('已保存');break;}
case 'delete-brew':{if(!confirm('确定删除这条冲煮记录吗？'))return;DB.brews=DB.brews.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
case 'new-experience':closeModal();setTimeout(()=>openExpForm(),120);break;case 'view-exp':{state.openSwipeId=null;viewExpDetail(id);}break;case 'edit-exp':state.openSwipeId=null;closeModal();setTimeout(()=>openExpForm(id),120);break;
case 'save-exp':{const d=readForm();if(!d.date)d.date=todayStr();if(id){Object.assign(DB.experiences.find(x=>x.id===id),d);}else{d.id=uid();d.createdAt=Date.now();DB.experiences.push(d);}save();closeModal();render();toast('已保存');break;}
case 'delete-exp':{if(!confirm('确定删除这条体验记录吗？'))return;DB.experiences=DB.experiences.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
case 'new-recipe':closeModal();setTimeout(()=>openRecipeForm(),120);break;case 'view-recipe':{state.openSwipeId=null;viewRecipeDetail(id);}break;case 'edit-recipe':state.openSwipeId=null;closeModal();setTimeout(()=>openRecipeForm(id),120);break;
case 'toggle-top-recipe':{const r=DB.recipes.find(x=>x.id===id);if(r){r.isTop=!r.isTop;save();state.openSwipeId=null;render();toast(r.isTop?'已置顶':'已取消置顶');}break;}
case 'save-recipe':{const d=readForm();if(!d.name){toast('请填写方案名称');return;}if(id){Object.assign(DB.recipes.find(x=>x.id===id),d);}else{d.id=uid();d.createdAt=Date.now();DB.recipes.push(d);}save();closeModal();render();toast('已保存');break;}
case 'delete-recipe':{if(!confirm('确定删除这个方案吗？'))return;DB.recipes=DB.recipes.filter(x=>x.id!==id);save();state.openSwipeId=null;render();toast('已删除');break;}
case 'bean-filter':state.beanFilter=el.dataset.v;state.openSwipeId=null;render();break;case 'bean-view':DB.settings.beanView=el.dataset.v;save();state.openSwipeId=null;render();break;case 'recipe-filter':state.recipeFilter=el.dataset.v;state.openSwipeId=null;render();break;case 'recipe-view':DB.settings.recipeView=el.dataset.v;save();state.openSwipeId=null;render();break;case 'log-filter':state.logFilter=el.dataset.v;state.openSwipeId=null;render();break;
case 'save-app-name':{const inp=$('#appNameInput');if(inp){DB.settings.appName=inp.value.trim()||'西洋豆浆萃';save();closeModal();render();toast('名称已保存');}break;}
case 'set-theme':DB.settings.theme=el.dataset.v;save();applyTheme();openSettings();toast('主题已切换');break;
case 'export-data':closeModal();setTimeout(openExport,120);break;
case 'copy-export':{const ta=$('#exportArea');if(ta){ta.select();ta.setSelectionRange(0,999999);try{document.execCommand('copy');toast('已复制');}catch(e){toast('请长按选择复制');}}break;}
case 'download-export':{try{const data=JSON.stringify(DB,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='西洋豆浆萃备份-'+todayStr()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已下载');}catch(e){toast('下载失败，请用复制');}break;}
case 'import-data':closeModal();setTimeout(openImport,120);break;
case 'do-import':{const ta=$('#importArea');if(!ta||!ta.value.trim()){toast('请先粘贴内容');return;}try{const d=JSON.parse(ta.value);const base=defaultDB();base.beans=Array.isArray(d.beans)?d.beans:[];base.brews=Array.isArray(d.brews)?d.brews:[];base.experiences=Array.isArray(d.experiences)?d.experiences:[];base.recipes=Array.isArray(d.recipes)?d.recipes:[];base.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});DB=base;save();closeModal();render();toast('导入成功');}catch(e){toast('格式错误，导入失败');}break;}
case 'clear-data':{if(!confirm('确定清空全部数据吗？此操作不可恢复。'))return;if(!confirm('再次确认：真的要清空所有记录吗？'))return;DB=defaultDB();save();closeModal();render();toast('已清空');break;}
}});

document.addEventListener('input',function(ev){const t=ev.target;if(t.id==='beanSearch'){state.beanSearch=t.value;state.openSwipeId=null;const pos=t.selectionStart;const v=t.value;$('#view').innerHTML=viewBeans();const ni=$('#beanSearch');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}}if(t.id==='logSearch'){state.logSearch=t.value;state.openSwipeId=null;const pos=t.selectionStart;const v=t.value;$('#view').innerHTML=viewLog();const ni=$('#logSearch');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}}if(t.id==='recipeSearch'){state.recipeSearch=t.value;state.openSwipeId=null;const pos=t.selectionStart;const v=t.value;$('#view').innerHTML=viewRecipes();const ni=$('#recipeSearch');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(e){}}}});
window.addEventListener('resize',()=>{document.documentElement.style.setProperty('--vh',window.innerHeight*0.01+'px');});
applyTheme();render();
</script>
